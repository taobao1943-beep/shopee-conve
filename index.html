<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蝦皮分潤連結轉換器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #ee4d2d 0%, #ff7337 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 560px;
      padding: 32px 28px;
    }
    h1 {
      font-size: 1.45rem;
      color: #ee4d2d;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 14px;
      resize: vertical;
      min-height: 120px;
      line-height: 1.45;
    }
    textarea:focus {
      outline: none;
      border-color: #ee4d2d;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #ee4d2d;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn:hover { background: #d73211; }
    .btn.secondary {
      background: #28a745;
    }
    .btn.secondary:hover { background: #218838; }
    .btn.ghost {
      background: #f0f0f0;
      color: #333;
    }
    .btn.ghost:hover { background: #e5e5e5; }
    .result-box {
      margin-top: 8px;
      display: none;
    }
    .result-box.show { display: block; }
    .result-label {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 6px;
    }
    .result-url {
      background: #f8f8f8;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px 14px;
      word-break: break-all;
      font-size: 0.85rem;
      color: #222;
      margin-bottom: 12px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .count {
      font-size: 0.85rem;
      color: #ee4d2d;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .tip {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #888;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦐 蝦皮分潤連結轉換器</h1>
    <p class="subtitle">
      依官方 an_redir 規格轉換<br>
      支援一次多筆 · 隨機 Affiliate ID
    </p>

    <label for="inputUrl">貼上蝦皮商品連結（每行一筆）</label>
    <textarea id="inputUrl" placeholder="https://shopee.tw/...&#10;https://shopee.tw/...&#10;https://s.shopee.tw/..."></textarea>

    <button class="btn" onclick="convert()">轉換成分潤連結</button>
    <button class="btn ghost" onclick="clearAll()">清除</button>

    <div class="result-box" id="resultBox">
      <div class="count" id="resultCount"></div>
      <div class="result-label">分潤連結（每行一筆）：</div>
      <div class="result-url" id="resultUrl"></div>
      <button class="btn secondary" onclick="copyResult()">一鍵複製全部</button>
    </div>

    <p class="tip">
      ※ 格式：s.shopee.tw/an_redir?origin_link=...&amp;affiliate_id=...&amp;sub_id=line666<br>
      ※ 每次轉換隨機使用一組 Affiliate ID。<br>
      ※ 可再把結果丟到 reurl 等短網址服務（官方允許的第三方包裝）。<br>
      ※ 純前端運作，資料不會上傳。
    </p>
  </div>

  <script>
    // ===== 填入要隨機使用的 Affiliate ID =====
    const AFFILIATE_IDS = [
      "16334990029",
      // "第二組ID",
      // "第三組ID",
    ];

    const SUB_ID = "line666";

    function getRandomAffiliateId() {
      const list = AFFILIATE_IDS.map(function (id) {
        return String(id).trim();
      }).filter(Boolean);
      if (!list.length) throw new Error("請至少在 AFFILIATE_IDS 填一組 ID");
      return list[Math.floor(Math.random() * list.length)];
    }

    function cleanShopeeUrl(raw) {
      var s = raw.trim();
      if (!s) return null;
      try {
        var url = new URL(s);
        // 只保留 origin + pathname，去掉追蹤參數
        return url.origin + url.pathname;
      } catch (e) {
        return s.split("?")[0].split("#")[0];
      }
    }

    function isShopeeUrl(url) {
      return /shopee\.(tw|com|sg|co\.\w+|com\.\w+)/i.test(url) ||
             /s\.shopee\.tw/i.test(url) ||
             /shope\.ee/i.test(url);
    }

    function toAffiliateLink(cleanUrl, affiliateId) {
      // 官方格式：an_redir?origin_link=ENCODED&affiliate_id=...&sub_id=...
      return "https://s.shopee.tw/an_redir?origin_link=" +
        encodeURIComponent(cleanUrl) +
        "&affiliate_id=" + encodeURIComponent(affiliateId) +
        "&sub_id=" + encodeURIComponent(SUB_ID);
    }

    function convert() {
      var raw = document.getElementById("inputUrl").value;
      var lines = raw.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);

      if (!lines.length) {
        alert("請至少貼上一筆蝦皮商品連結");
        return;
      }

      var results = [];
      var errors = [];

      for (var i = 0; i < lines.length; i++) {
        var clean = cleanShopeeUrl(lines[i]);
        if (!clean || !isShopeeUrl(clean)) {
          errors.push("第 " + (i + 1) + " 行不是有效的蝦皮連結");
          continue;
        }
        try {
          var affId = getRandomAffiliateId();
          results.push(toAffiliateLink(clean, affId));
        } catch (e) {
          alert(e.message);
          return;
        }
      }

      if (!results.length) {
        alert(errors.join("\n") || "沒有可轉換的連結");
        return;
      }

      document.getElementById("resultUrl").textContent = results.join("\n");
      document.getElementById("resultCount").textContent =
        "完成，共產生 " + results.length + " 個推廣連結" +
        (errors.length ? "（略過 " + errors.length + " 筆無效）" : "");
      document.getElementById("resultBox").classList.add("show");
    }

    function copyResult() {
      var text = document.getElementById("resultUrl").textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(function () {
        var btn = document.querySelector(".btn.secondary");
        btn.textContent = "已複製！";
        setTimeout(function () { btn.textContent = "一鍵複製全部"; }, 1500);
      }).catch(function () {
        var range = document.createRange();
        range.selectNodeContents(document.getElementById("resultUrl"));
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        alert("請手動複製選取的文字");
      });
    }

    function clearAll() {
      document.getElementById("inputUrl").value = "";
      document.getElementById("resultUrl").textContent = "";
      document.getElementById("resultCount").textContent = "";
      document.getElementById("resultBox").classList.remove("show");
    }
  </script>
</body>
</html>
