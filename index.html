<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蝦皮分潤連結轉換器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #ee4d2d 0%, #ff7337 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 520px;
      padding: 32px 28px;
    }
    h1 {
      font-size: 1.5rem;
      color: #ee4d2d;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      margin-bottom: 16px;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #ee4d2d;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #ee4d2d;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #d73211; }
    .result-box {
      margin-top: 20px;
      display: none;
    }
    .result-box.show { display: block; }
    .result-label {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 6px;
    }
    .result-url {
      background: #f8f8f8;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px 14px;
      word-break: break-all;
      font-size: 0.9rem;
      color: #222;
      margin-bottom: 12px;
    }
    .copy-btn { background: #28a745; }
    .copy-btn:hover { background: #218838; }
    .tip {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #888;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦐 蝦皮分潤連結轉換器</h1>
    <p class="subtitle">貼上任意蝦皮商品連結 → 轉成你的分潤追蹤連結</p>

    <label for="inputUrl">貼上蝦皮商品連結</label>
    <textarea id="inputUrl" placeholder="https://shopee.tw/... 或 https://s.shopee.tw/..."></textarea>

    <button class="btn" onclick="convert()">轉換成我的分潤連結</button>

    <div class="result-box" id="resultBox">
      <div class="result-label">你的分潤連結：</div>
      <div class="result-url" id="resultUrl"></div>
      <button class="btn copy-btn" onclick="copyResult()">一鍵複製</button>
    </div>

    <p class="tip">
      ※ 建議貼「完整商品頁連結」，效果最穩定。<br>
      ※ 純前端運作，不會上傳任何資料。
    </p>
  </div>

  <script>
    const AFFILIATE_ID = "16334990029";
    const SUB_ID = "line666";

    function cleanShopeeUrl(raw) {
      try {
        const url = new URL(raw.trim());
        return url.origin + url.pathname;
      } catch (e) {
        return null;
      }
    }

    function convert() {
      const inputUrl = document.getElementById("inputUrl").value.trim();
      if (!inputUrl) {
        alert("請貼上蝦皮商品連結");
        return;
      }

      let cleanUrl = cleanShopeeUrl(inputUrl);
      if (!cleanUrl) {
        cleanUrl = inputUrl.split("?")[0].split("#")[0];
      }

      if (!/shopee\.(tw|com|sg|co\.\w+|com\.\w+)/i.test(cleanUrl) && !/s\.shopee\.tw/i.test(cleanUrl)) {
        alert("請確認這是蝦皮連結（例如 shopee.tw）");
        return;
      }

      const encoded = encodeURIComponent(cleanUrl);
      const finalUrl =
        `https://s.shopee.tw/an_redir?origin_link=${encoded}` +
        `&affiliate_id=${AFFILIATE_ID}` +
        `&sub_id=${encodeURIComponent(SUB_ID)}`;

      document.getElementById("resultUrl").textContent = finalUrl;
      document.getElementById("resultBox").classList.add("show");
    }

    function copyResult() {
      const text = document.getElementById("resultUrl").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "已複製！";
        setTimeout(() => (btn.textContent = "一鍵複製"), 1500);
      }).catch(() => {
        const range = document.createRange();
        range.selectNodeContents(document.getElementById("resultUrl"));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        alert("請手動複製選取的文字");
      });
    }

    document.getElementById("inputUrl").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        convert();
      }
    });
  </script>
</body>
</html>
